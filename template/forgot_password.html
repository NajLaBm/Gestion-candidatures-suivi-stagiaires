<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Mot de passe oublié - Plateforme Stage</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

</head>

<body style="background:#f5f7fb;">

<div class="container">

    <div class="card mx-auto mt-5 p-4"
         style="max-width:500px; border-radius:15px;">

        <h2 class="text-center">
            Mot de passe oublié
        </h2>

        <p class="text-muted text-center">
            Entrez votre adresse email pour récupérer
            votre mot de passe.
        </p>

        <form method="POST">

            <div class="mb-3">

                <label class="form-label">
                    Adresse email
                </label>

                <input
                    type="email"
                    name="email"
                    class="form-control"
                    required>

            </div>

            <button
                type="submit"
                class="btn btn-primary w-100">

                Envoyer

            </button>

        </form>

        <div class="text-center mt-3">

            <a href="{{ url_for('login') }}">
                Retour à la connexion
            </a>

        </div>

    </div>

</div>

</body>
</html>
